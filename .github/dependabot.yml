version: 2

updates:
  # Workflow actions are pinned to full commit SHAs. Dependabot updates the
  # SHA references; trailing # vX.Y.Z comments document their release tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Spyglass dependencies and package-lock.json live in this subdirectory.
  - package-ecosystem: npm
    directory: /scripts/spyglass
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
