# Offline checks plus real-server smoke tests for ARMOUR. All actions are pinned to verified release commits.
name: Self-test

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify workflow action lockfile
        if: hashFiles('.github/workflows/actions.lock') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
      - uses: raven-actions/actionlint@v2.2.0
      - uses: biomejs/setup-biome@v2.7.1
        with:
          version: "2.6.8"
          working-dir: .
      - run: biome check scripts/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/spyglass/package-lock.json
      - name: Install Spyglass test dependencies
        working-directory: scripts/spyglass
        run: npm ci --no-audit --no-fund --no-bin-links
      - name: Test Spyglass lint helpers
        working-directory: scripts/spyglass
        run: npm test
      - uses: DavidAnson/markdownlint-cli2-action@v25.1.0
        with:
          globs: README.md
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: format --check

  unit_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m unittest discover -s tests -v

  discover_versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - id: versions
        run: python scripts/get_minecraft_versions.py --release-from 1.21.9 --snapshot-after 26.3

  integration_tests:
    name: integration_tests (${{ matrix.id }})
    needs: discover_versions
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover_versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run tests on a real Minecraft server
        id: server-tests
        shell: bash
        env:
          MINECRAFT_VERSION: ${{ matrix.id }}
          MINECRAFT_KIND: ${{ matrix.kind }}
          MINECRAFT_SERVER_URL: ${{ matrix.server_url }}
          MINECRAFT_SERVER_SHA1: ${{ matrix.sha1 }}
        run: |
          set +e
          python scripts/run_server_tests.py \
            --version "$MINECRAFT_VERSION" \
            --kind "$MINECRAFT_KIND" \
            --server-url "$MINECRAFT_SERVER_URL" \
            --sha1 "$MINECRAFT_SERVER_SHA1" \
            --repo . \
            --pack-path tests/fixtures/server-pack \
            --tests-dir tests/fixtures/server-tests \
            --suppress-failure-annotations \
            > "$RUNNER_TEMP/armour-server.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/armour-server.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Verify the expected test success is reported
        shell: bash
        run: |
          if ! grep -Fq "passed=1 failed=1 skipped=0" "$RUNNER_TEMP/armour-server.log"; then
            echo "The server did not report the expected test success."
            exit 1
          fi
          echo "PASS: The expected test success was correctly reported."

      - name: Verify the intentional test failure is detected
        shell: bash
        env:
          SERVER_TEST_EXIT_CODE: ${{ steps.server-tests.outputs.exit_code }}
        run: |
          if [[ "$SERVER_TEST_EXIT_CODE" -ne 1 ]] || ! grep -Fq \
            "passed=1 failed=1 skipped=0; 0 pack load errors" \
            "$RUNNER_TEMP/armour-server.log"; then
            echo "The server did not report the expected intentional failure."
            exit 1
          fi
          echo "PASS: The intentional test failure was correctly detected."

  self_test:
    name: Self-test
    if: always()
    needs: [lint, unit_tests, discover_versions, integration_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Self-test job to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          DISCOVERY_RESULT: ${{ needs.discover_versions.result }}
          INTEGRATION_RESULT: ${{ needs.integration_tests.result }}
        run: |
          for result in "$LINT_RESULT" "$UNIT_RESULT" "$DISCOVERY_RESULT" "$INTEGRATION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A Self-test job did not succeed: $result"
              exit 1
            fi
          done
          echo "All Self-test jobs passed."
